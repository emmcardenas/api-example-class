service: api-example-class

plugins:
  - serverless-python-requirements
provider:
  name: aws
  runtime: python3.8
  stage: ${self:custom.stage}
  cfnRole: arn:aws:iam::${self:custom.config.${self:custom.stage}.account_id}:role/EmmAWSCloudFormationExecutionRole # ARN of an IAM role for CloudFormation service. If specified, CloudFormation uses the role's credentials
  environment:
    GITHUB_CLIENT_ID: ${env:GITHUB_CLIENT_ID}
    GITHUB_CLIENT_SECRET: ${env:GITHUB_CLIENT_SECRET}
    GITHUB_REDIRECT_URI: ${env:GITHUB_REDIRECT_URI}
    JWT_SECRET: ${env:JWT_SECRET}

custom:
  pythonRequirements:
    dockerizePip: non-linux
    fileName: requirements.txt
  dynamodb:
    start:
      migrate: true
    stages:
      - dev
  stage: ${opt:env}
  config:
    dev:
      account_id: ''
    stg:
      memory_size: 128
      account_id: '723706874016'
    prd:
      memory_size: 256
      account_id: '691789668597' #to be defined
  
functions:
  # Authentication endpoints
  githubLogin:
    handler: auth.github_login
    events:
      - http:
          method: GET
          path: /auth/github
          private: false
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
    timeout: 600
    role: arn:aws:iam::${self:custom.config.${self:custom.stage}.account_id}:role/EmmAWSMasterbuilderLambdaExecutionRole
    tags:
      Name: master-builder-github-login
  githubCallback:
    handler: auth.github_callback
    events:
      - http:
          method: GET
          path: /auth/github/callback
          private: false
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
    timeout: 600
    role: arn:aws:iam::${self:custom.config.${self:custom.stage}.account_id}:role/EmmAWSMasterbuilderLambdaExecutionRole
    tags:
      Name: master-builder-github-callback
  getUserProfile:
    handler: auth.get_user_profile
    events:
      - http:
          method: GET
          path: /auth/profile
          private: false
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
    timeout: 600
    role: arn:aws:iam::${self:custom.config.${self:custom.stage}.account_id}:role/EmmAWSMasterbuilderLambdaExecutionRole
    tags:
      Name: master-builder-user-profile
  # Existing endpoints
  ping:
    handler: ping.lambda_handler
    events:
      - http:
          method: GET
          path: /ping
          private: false
    timeout: 600
    role: arn:aws:iam::${self:custom.config.${self:custom.stage}.account_id}:role/EmmAWSMasterbuilderLambdaExecutionRole
    tags:
      Name: master-builder-ping
  ping2:
    handler: ping.ping2
    events:
      - http:
          method: GET
          path: /ping2
          private: false
    timeout: 600
    role: arn:aws:iam::${self:custom.config.${self:custom.stage}.account_id}:role/EmmAWSMasterbuilderLambdaExecutionRole
    tags:
      Name: master-builder-ping2
  ping3:
    handler: ping.ping3
    events:
      - http:
          method: GET
          path: /ping3
          private: false
    timeout: 600
    role: arn:aws:iam::${self:custom.config.${self:custom.stage}.account_id}:role/EmmAWSMasterbuilderLambdaExecutionRole
    tags:
      Name: master-builder-ping3
  getItems:
    handler: items.get_all_items
    events:
      - http:
          method: GET
          path: /items
          private: false
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
    timeout: 600
    role: arn:aws:iam::${self:custom.config.${self:custom.stage}.account_id}:role/EmmAWSMasterbuilderLambdaExecutionRole
    tags:
      Name: master-builder-get-items
  getItem:
    handler: items.get_item
    events:
      - http:
          method: GET
          path: /items/{proxy+}
          private: false
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
    timeout: 600
    role: arn:aws:iam::${self:custom.config.${self:custom.stage}.account_id}:role/EmmAWSMasterbuilderLambdaExecutionRole
    tags:
      Name: master-builder-get-item
  createItem:
    handler: items.create_item_protected
    events:
      - http:
          method: POST
          path: /items
          private: false
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
    timeout: 600
    role: arn:aws:iam::${self:custom.config.${self:custom.stage}.account_id}:role/EmmAWSMasterbuilderLambdaExecutionRole
    tags:
      Name: master-builder-create-item
  updateItem:
    handler: items.update_item_protected
    events:
      - http:
          method: PUT
          path: /items
          private: false
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
    timeout: 600
    role: arn:aws:iam::${self:custom.config.${self:custom.stage}.account_id}:role/EmmAWSMasterbuilderLambdaExecutionRole
    tags:
      Name: master-builder-update-item
  deleteItem:
    handler: items.delete_item_protected
    events:
      - http:
          method: DELETE
          path: /items/{proxy+}
          private: false
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
    timeout: 600
    role: arn:aws:iam::${self:custom.config.${self:custom.stage}.account_id}:role/EmmAWSMasterbuilderLambdaExecutionRole
    tags:
      Name: master-builder-delete-item